name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 httpx pillow pyinstaller

      - name: Build macOS Application with PyInstaller
        run: |
          pyinstaller \
            --name "LiquidCADStudio" \
            --windowed \
            --noconfirm \
            --icon "desktop-app/assets/icon.icns" \
            --add-data "desktop-app/main.qml:desktop-app" \
            --add-data "desktop-app/assets:desktop-app/assets" \
            --hidden-import "PySide6.QtQuick" \
            --hidden-import "PySide6.QtQml" \
            --hidden-import "PySide6.QtQuickControls2" \
            --hidden-import "httpx" \
            desktop-app/main.py

      - name: Package macOS .app into ZIP
        run: |
          cd dist
          zip -r -y ../LiquidCADStudio-macOS.zip LiquidCADStudio.app
          cd ..

      - name: Create macOS .dmg Installer
        run: |
          mkdir -p dmg_staging
          cp -R dist/LiquidCADStudio.app dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "LiquidCADStudio" -srcfolder dmg_staging -ov -format UDZO LiquidCADStudio-macOS.dmg
          rm -rf dmg_staging

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: |
            LiquidCADStudio-macOS.dmg
            LiquidCADStudio-macOS.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 httpx pillow pyinstaller

      - name: Build Windows Standalone Executable (.exe)
        run: |
          pyinstaller `
            --name "LiquidCADStudio" `
            --windowed `
            --onefile `
            --noconfirm `
            --icon "desktop-app/assets/icon.ico" `
            --add-data "desktop-app/main.qml;desktop-app" `
            --add-data "desktop-app/assets;desktop-app/assets" `
            --hidden-import "PySide6.QtQuick" `
            --hidden-import "PySide6.QtQml" `
            --hidden-import "PySide6.QtQuickControls2" `
            --hidden-import "httpx" `
            desktop-app/main.py

      - name: Prepare Windows Release Files
        run: |
          Copy-Item dist\LiquidCADStudio.exe -Destination LiquidCADStudio-Windows.exe
          Compress-Archive -Path dist\LiquidCADStudio.exe -DestinationPath LiquidCADStudio-Windows.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            LiquidCADStudio-Windows.exe
            LiquidCADStudio-Windows.zip

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-binaries

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LiquidCADStudio ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            LiquidCADStudio-macOS.dmg
            LiquidCADStudio-macOS.zip
            LiquidCADStudio-Windows.exe
            LiquidCADStudio-Windows.zip
