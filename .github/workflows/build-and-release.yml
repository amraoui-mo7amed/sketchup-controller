name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 httpx pillow pyinstaller

      - name: Generate Application Icons
        run: |
          python generate_icons.py

      - name: Build macOS Application with PyInstaller
        run: |
          pyinstaller \
            --name "LiquidCADStudio" \
            --windowed \
            --noconfirm \
            --icon "desktop-app/assets/icon.icns" \
            --add-data "desktop-app/main.qml:desktop-app" \
            --add-data "desktop-app/assets:desktop-app/assets" \
            --hidden-import "PySide6.QtQuick" \
            --hidden-import "PySide6.QtQml" \
            --hidden-import "PySide6.QtQuickControls2" \
            --hidden-import "httpx" \
            desktop-app/main.py

      - name: Package macOS .app into ZIP
        run: |
          cd dist
          zip -r ../LiquidCADStudio-macOS.zip LiquidCADStudio.app
          cd ..

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidCADStudio-macOS
          path: LiquidCADStudio-macOS.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 httpx pillow pyinstaller

      - name: Generate Application Icons
        run: |
          python generate_icons.py

      - name: Build Windows Executable with PyInstaller
        run: |
          pyinstaller `
            --name "LiquidCADStudio" `
            --windowed `
            --noconfirm `
            --icon "desktop-app/assets/icon.ico" `
            --add-data "desktop-app/main.qml;desktop-app" `
            --add-data "desktop-app/assets;desktop-app/assets" `
            --hidden-import "PySide6.QtQuick" `
            --hidden-import "PySide6.QtQml" `
            --hidden-import "PySide6.QtQuickControls2" `
            --hidden-import "httpx" `
            desktop-app/main.py

      - name: Package Windows Binary into ZIP
        run: |
          Compress-Archive -Path dist\LiquidCADStudio -DestinationPath LiquidCADStudio-Windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidCADStudio-Windows
          path: LiquidCADStudio-Windows.zip

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: LiquidCADStudio-macOS

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: LiquidCADStudio-Windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LiquidCADStudio ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            LiquidCADStudio-macOS.zip
            LiquidCADStudio-Windows.zip
            desktop-app/assets/icon.ico
            desktop-app/assets/icon.icns
            desktop-app/assets/app_icon.png
            desktop-app/assets/favicon.ico
