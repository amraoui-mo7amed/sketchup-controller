name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 httpx pillow pyinstaller

      - name: Build macOS Application with PyInstaller
        run: |
          pyinstaller \
            --name "LiquidCADStudio" \
            --windowed \
            --noconfirm \
            --icon "desktop-app/assets/icon.icns" \
            --paths "desktop-app" \
            --add-data "desktop-app/main.qml:." \
            --add-data "desktop-app/main.qml:desktop-app" \
            --add-data "desktop-app/assets:assets" \
            --add-data "desktop-app/assets:desktop-app/assets" \
            --hidden-import "httpx" \
            desktop-app/main.py

      - name: Package macOS Application into DMG
        run: |
          mkdir -p dmg_staging
          cp -R dist/LiquidCADStudio.app dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "LiquidCADStudio" -srcfolder dmg_staging -ov -format UDZO LiquidCADStudio-macOS.dmg

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidCADStudio-macOS
          path: LiquidCADStudio-macOS.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 httpx pillow pyinstaller

      - name: Build Windows Standalone Executable (.exe)
        run: |
          pyinstaller `
            --name "LiquidCADStudio-Windows" `
            --onefile `
            --windowed `
            --noconfirm `
            --icon "desktop-app/assets/icon.ico" `
            --paths "desktop-app" `
            --add-data "desktop-app/main.qml;." `
            --add-data "desktop-app/main.qml;desktop-app" `
            --add-data "desktop-app/assets;assets" `
            --add-data "desktop-app/assets;desktop-app/assets" `
            --hidden-import "httpx" `
            desktop-app/main.py

      - name: Copy Windows Executable for Release
        run: |
          Copy-Item dist\LiquidCADStudio-Windows.exe -Destination LiquidCADStudio-Windows.exe

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidCADStudio-Windows
          path: LiquidCADStudio-Windows.exe

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: LiquidCADStudio-macOS

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: LiquidCADStudio-Windows

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Liquid CAD Studio ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            LiquidCADStudio-macOS.dmg
            LiquidCADStudio-Windows.exe
